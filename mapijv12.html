<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Lejátszó">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/111111/FFFFFF?text=%E2%96%B6">
    
    <title>Iframe Lejátszó - Teljesen Titkosított JSON</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f9;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        .control-panel {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-weight: bold; color: #495057; margin-bottom: 5px; }

        textarea, input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-weight: bold;
            color: #333;
        }

        select { background-color: #e9ecef; cursor: pointer; }
        textarea { resize: vertical; white-space: pre; }

        button {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #0056b3;
            color: white;
            font-weight: bold;
            font-size: 1.1em;
            transition: background-color 0.2s;
            width: 100%;
            margin-bottom: 10px;
        }

        button:hover { background-color: #004494; }

        .nav-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #e9ecef;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .nav-controls button { width: auto; margin: 0; background-color: #6c757d; }
        .nav-controls button:hover { background-color: #5a6268; }
        .nav-controls button:disabled { background-color: #cccccc; cursor: not-allowed; }

        #counter-text { font-weight: bold; font-size: 1.2em; color: #333; }
        #toggle-mode-btn { background-color: #28a745; }
        #toggle-mode-btn:hover { opacity: 0.9; }

        #keyword-container {
            margin-bottom: 15px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 4px;
            border-left: 4px solid #17a2b8;
            display: none;
        }
        #keyword-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .keyword-btn {
            width: auto; padding: 6px 12px; margin: 0; font-size: 0.9em;
            background-color: #6c757d; border-radius: 20px;
        }
        .keyword-btn:hover { background-color: #5a6268; }
        .keyword-btn.active { background-color: #17a2b8; }
        .keyword-btn.active:hover { background-color: #138496; }

        #video-info-panel {
            background: #e9ecef;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
            display: none;
            border-left: 4px solid #ffc107;
        }
        #info-header { font-weight: bold; font-size: 1.2em; color: #333; margin-bottom: 4px; }
        #info-keywords { font-size: 0.95em; color: #666; font-style: italic; }

        .video-container {
            background: #000;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            position: relative;
            width: 100%;
            height: 60vh;
            overflow: auto; 
            -webkit-overflow-scrolling: touch;
        }
        #iframe-wrapper {
            width: 100%; height: 100%; transform-origin: top left;
            transition: transform 0.1s ease-out; position: relative;
        }
        #zoom-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; display: none; background: rgba(0,0,0,0);
        }
        iframe { display: block; width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="control-panel">
        
        <div class="input-group">
            <label for="list-select">Online TXT listák (csak linkek):</label>
            <select id="list-select">
                <option value="default">Saját megadott linkek (alapértelmezett)</option>
            </select>
        </div>

        <div class="input-group">
            <label for="json-list-select" style="color: #0056b3;">Online JSON listák (Titkosított):</label>
            <select id="json-list-select">
                <option value="default">Válassz egy online JSON listát...</option>
            </select>
        </div>

        <div class="input-group">
            <label for="video-url">Beágyazás linkjei / Nyers lista:</label>
            <textarea id="video-url" rows="3" placeholder="Illeszd be a linkeket...">https://player.mediadelivery.net/embed/12345/mapij-6789-xyz</textarea>
        </div>
        
        <div class="input-group">
            <label for="replace-word">Jelszó / Csere szó (csak kisbetű):</label>
            <input type="text" id="replace-word" value="" placeholder="jelszó / csere szó...">
        </div>
        
        <button id="load-btn">Lista Betöltése / Szűrés Frissítése</button>
        
        <div id="keyword-container">
            <label style="font-weight: bold; color: #495057; margin-bottom: 5px; display:block;">Szűrés kulcsszavak alapján:</label>
            <span style="font-size: 0.85em; color: #666;">Válassz egyet vagy többet. Csak azok a videók jelennek meg, amikben az <b>összes</b> kiválasztott kulcsszó szerepel.</span>
            <div id="keyword-buttons"></div>
        </div>

        <div class="nav-controls">
            <button id="prev-btn" disabled>« Előző</button>
            <span id="counter-text">0 / 0</span>
            <button id="next-btn" disabled>Következő »</button>
        </div>

        <div id="video-info-panel">
            <div id="info-header"><span id="info-id"></span> <span id="info-title"></span></div>
            <div id="info-keywords"></div>
        </div>

        <button id="toggle-mode-btn">Mód: VIDEÓ VEZÉRLÉS (Kattints a nagyításhoz!)</button>
    </div>

    <div class="video-container" id="viewport">
        <div id="iframe-wrapper">
            <div id="zoom-overlay"></div>
            <iframe id="player-frame" src="" loading="lazy" allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;" allowfullscreen="true"></iframe>
        </div>
    </div>

    <script>
        const listSelect = document.getElementById('list-select');
        const jsonListSelect = document.getElementById('json-list-select');
        const videoUrlInput = document.getElementById('video-url');
        const replaceWordInput = document.getElementById('replace-word');
        const loadBtn = document.getElementById('load-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const counterText = document.getElementById('counter-text');
        
        const keywordContainer = document.getElementById('keyword-container');
        const keywordButtonsDiv = document.getElementById('keyword-buttons');
        const videoInfoPanel = document.getElementById('video-info-panel');
        
        const iframeWrapper = document.getElementById('iframe-wrapper');
        const playerFrame = document.getElementById('player-frame');
        const viewport = document.getElementById('viewport');
        const zoomOverlay = document.getElementById('zoom-overlay');
        const toggleModeBtn = document.getElementById('toggle-mode-btn');

        let allPlaylist = [];     
        let activePlaylist = [];  
        let currentIndex = 0;
        let allKeywords = new Set();
        let selectedKeywords = new Set();
        let currentLoadedSource = 'text'; 

        replaceWordInput.addEventListener('input', function() {
            this.value = this.value.toLowerCase();
        });

        function decryptUrl(hash, key) {
            if (!key) return hash;
            try {
                const decoded = atob(hash);
                let xor = '';
                for(let i=0; i<decoded.length; i++) {
                    xor += String.fromCharCode(decoded.charCodeAt(i) ^ key.charCodeAt(i % key.length));
                }
                return decodeURIComponent(xor);
            } catch(e) { return hash; }
        }

        const githubTextBaseUrl = 'https://raw.githubusercontent.com/adamrobot16/mapijv/refs/heads/main/mapijv_text_';
        const githubJsonBaseUrl = 'https://raw.githubusercontent.com/adamrobot16/mapijv/refs/heads/main/mapijv_json_';
        let fetchedLists = {}; 
        let fetchedJsonLists = {};

        async function fetchExternalFiles() {
            let fileIndex = 1;
            while (true) {
                const paddedNum = String(fileIndex).padStart(2, '0');
                try {
                    const response = await fetch(`${githubTextBaseUrl}${paddedNum}.txt`);
                    if (response.ok) {
                        const text = await response.text();
                        const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                        if (lines.length > 0) {
                            fetchedLists[paddedNum] = lines.slice(1).join('\n');
                            const opt = document.createElement('option');
                            opt.value = paddedNum; opt.textContent = lines[0];
                            listSelect.appendChild(opt);
                        }
                    } else break;
                } catch (e) { break; }
                fileIndex++;
            }

            fileIndex = 1;
            while (true) {
                const paddedNum = String(fileIndex).padStart(2, '0');
                try {
                    // MÓDOSÍTÁS: Nyers szövegként töltjük le, mert a fájl titkosított zagyvaság!
                    const response = await fetch(`${githubJsonBaseUrl}${paddedNum}.json`);
                    if (response.ok) {
                        const rawText = await response.text();
                        
                        // Csak eltároljuk a nyers, titkosított szöveget. A dekódolás gombnyomásra történik.
                        fetchedJsonLists[paddedNum] = { rawText: rawText };
                        const opt = document.createElement('option');
                        opt.value = paddedNum; 
                        opt.textContent = `Titkosított JSON Lista ${paddedNum}`;
                        jsonListSelect.appendChild(opt);
                    } else break;
                } catch (e) { break; }
                fileIndex++;
            }
        }
        fetchExternalFiles();

        listSelect.addEventListener('change', (e) => {
            jsonListSelect.value = 'default';
            currentLoadedSource = 'text';
            if (e.target.value === 'default') {
                videoUrlInput.value = "https://player.mediadelivery.net/embed/12345/mapij-6789-xyz";
            } else if (fetchedLists[e.target.value]) {
                videoUrlInput.value = fetchedLists[e.target.value];
                setTimeout(() => { loadBtn.click(); }, 100);
            }
        });

        jsonListSelect.addEventListener('change', (e) => {
            listSelect.value = 'default';
            if (e.target.value === 'default') {
                currentLoadedSource = 'text'; return;
            }
            currentLoadedSource = 'json';
            // Itt csak beállítjuk a kiválasztást, a tényleges dekódolás a gombnyomáskor indul
            setTimeout(() => { loadBtn.click(); }, 100);
        });

        function renderKeywordsUI() {
            keywordButtonsDiv.innerHTML = '';
            if (allKeywords.size === 0) {
                keywordContainer.style.display = 'none';
                return;
            }
            keywordContainer.style.display = 'block';
            
            const sortedKeywords = Array.from(allKeywords).sort((a, b) => a.localeCompare(b));
            
            sortedKeywords.forEach(kw => {
                const btn = document.createElement('button');
                btn.textContent = kw;
                btn.className = selectedKeywords.has(kw) ? 'keyword-btn active' : 'keyword-btn';
                btn.onclick = () => {
                    if (selectedKeywords.has(kw)) selectedKeywords.delete(kw);
                    else selectedKeywords.add(kw);
                    btn.className = selectedKeywords.has(kw) ? 'keyword-btn active' : 'keyword-btn';
                    applyFilters();
                };
                keywordButtonsDiv.appendChild(btn);
            });
        }

        function applyFilters() {
            if (selectedKeywords.size === 0) {
                activePlaylist = [...allPlaylist];
            } else {
                activePlaylist = allPlaylist.filter(v => {
                    return Array.from(selectedKeywords).every(selectedKw => v.keywords.includes(selectedKw));
                });
            }
            
            if (activePlaylist.length === 0) {
                counterText.textContent = `0 / 0`;
                playerFrame.src = "";
                videoInfoPanel.style.display = 'none';
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                return;
            }

            currentIndex = 0;
            prevBtn.disabled = activePlaylist.length <= 1;
            nextBtn.disabled = activePlaylist.length <= 1;
            updateVideo();
        }

        function updateVideo() {
            if (activePlaylist.length === 0) return;
            
            const currentVid = activePlaylist[currentIndex];
            let finalUrl = currentVid.url;
            
            const autoPlayParams = "autoplay=true&muted=true";
            finalUrl += (finalUrl.includes('?') ? '&' : '?') + autoPlayParams;

            playerFrame.src = finalUrl;
            counterText.textContent = `${currentIndex + 1} / ${activePlaylist.length}`;

            if (currentVid.title || currentVid.id || currentVid.keywords.length > 0) {
                videoInfoPanel.style.display = 'block';
                document.getElementById('info-id').textContent = currentVid.id ? `#${currentVid.id} - ` : '';
                document.getElementById('info-title').textContent = currentVid.title || 'Névtelen térkép';
                document.getElementById('info-keywords').textContent = currentVid.keywords.length > 0 ? `Címkék: ${currentVid.keywords.join(', ')}` : '';
            } else {
                videoInfoPanel.style.display = 'none';
            }

            currentScale = 1.0;
            iframeWrapper.style.transform = `scale(${currentScale})`;
            iframeWrapper.style.width = '100%';
            iframeWrapper.style.height = '100%';
        }

        loadBtn.addEventListener('click', () => {
            const newWord = replaceWordInput.value.trim();
            const replacementWord = newWord || 'mapij';
            
            allPlaylist = [];
            allKeywords = new Set();
            selectedKeywords = new Set(); 

            if (currentLoadedSource === 'json') {
                const selectedVal = jsonListSelect.value;
                if (!fetchedJsonLists[selectedVal]) return;

                const rawText = fetchedJsonLists[selectedVal].rawText;
                
                // MÓDOSÍTÁS: Dekódoljuk a teljes JSON fájlt sorról sorra
                let decryptedLines = rawText.split('\n').map(line => {
                    let t = line.trim();
                    return t.length > 0 ? decryptUrl(t, newWord) : '';
                });

                let jsonData;
                try {
                    // A dekódolt sorokat összerakjuk egy stringgé, majd JSON-ként értelmezzük
                    jsonData = JSON.parse(decryptedLines.join(''));
                } catch(e) {
                    alert("Nem sikerült dekódolni a JSON fájlt! Biztosan jó a jelszó?");
                    return;
                }

                let mapsData = jsonData.videos || jsonData.maps || [];
                let decryptedTextForTextarea = [];
                
                mapsData.forEach((item) => {
                    let rawUrl = item.map_URL || item.url || '';
                    if (!rawUrl) return;

                    // Itt már nem hívunk decryptUrl-t a linkre, hiszen a JSON parse előtt már minden dekódolódott!
                    let finalUrl = rawUrl.replaceAll('mapij', replacementWord);
                    decryptedTextForTextarea.push(rawUrl);

                    const id = item.sorszam || item.id || '';
                    const title = item.cim || item.title || '';
                    let keywords = [];
                    if (item.kulcsszavak && Array.isArray(item.kulcsszavak)) keywords = item.kulcsszavak;
                    else if (item.keywords && Array.isArray(item.keywords)) keywords = item.keywords;

                    allPlaylist.push({ url: finalUrl, id: id, title: title, keywords: keywords });
                    keywords.forEach(kw => allKeywords.add(kw));
                });
                videoUrlInput.value = decryptedTextForTextarea.join('\n');
            } else {
                const text = videoUrlInput.value;
                let rawUrls = text.split('\n').map(url => url.trim()).filter(url => url.length > 0);
                if (rawUrls.length === 0) return alert("Kérlek, adj meg legalább egy linket!");

                let decryptedTextArray = [];
                rawUrls.forEach(url => {
                    let decrypted = url.startsWith('http') ? url : decryptUrl(url, newWord);
                    decryptedTextArray.push(decrypted);
                    let finalUrl = decrypted.replaceAll('mapij', replacementWord);
                    allPlaylist.push({ url: finalUrl, id: '', title: '', keywords: [] }); 
                });
                videoUrlInput.value = decryptedTextArray.join('\n');
            }

            renderKeywordsUI();
            applyFilters();
        });

        nextBtn.addEventListener('click', () => {
            if (activePlaylist.length === 0) return;
            currentIndex = (currentIndex + 1) % activePlaylist.length;
            updateVideo();
        });

        prevBtn.addEventListener('click', () => {
            if (activePlaylist.length === 0) return;
            currentIndex = (currentIndex - 1 + activePlaylist.length) % activePlaylist.length;
            updateVideo();
        });

        window.addEventListener('message', (event) => {
            try {
                let data = event.data;
                if (typeof data === 'string') {
                    try { data = JSON.parse(data); } catch(e) {}
                }
                if (data === 'ended' || data.event === 'ended' || data.message === 'ended') {
                    nextBtn.click();
                }
            } catch(e) {}
        });

        let isZoomMode = false;
        
        toggleModeBtn.addEventListener('click', () => {
            isZoomMode = !isZoomMode;
            if (isZoomMode) {
                toggleModeBtn.textContent = 'Mód: NAGYÍTÁS ÉS MOZGATÁS (Kattints ide a vezérléshez!)';
                toggleModeBtn.style.backgroundColor = '#dc3545';
                zoomOverlay.style.display = 'block';
            } else {
                toggleModeBtn.textContent = 'Mód: VIDEÓ VEZÉRLÉS (Kattints ide a nagyításhoz!)';
                toggleModeBtn.style.backgroundColor = '#28a745';
                zoomOverlay.style.display = 'none';
            }
        });

        let currentScale = 1.0;
        let initialPinchDistance = null;
        let startPinchScale = 1.0;

        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2 && isZoomMode) {
                initialPinchDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                startPinchScale = currentScale;
            }
        }, { passive: false });

        viewport.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialPinchDistance !== null && isZoomMode) {
                e.preventDefault();
                const currentDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                currentScale = startPinchScale * (currentDistance / initialPinchDistance);
                currentScale = Math.max(1.0, Math.min(currentScale, 4.0));
                
                iframeWrapper.style.transform = `scale(${currentScale})`;
                iframeWrapper.style.width = (100 * currentScale) + '%';
                iframeWrapper.style.height = (100 * currentScale) + '%';
            }
        }, { passive: false });

        viewport.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) initialPinchDistance = null;
        });
    </script>
</body>
</html>
